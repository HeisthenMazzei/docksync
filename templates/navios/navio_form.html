{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold text-[#0B1A2A] mb-6">➕ Adicionar Nova Programação de Navio</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Navio</label>
            <select name="navio" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
                <option value="">-- Selecione o Navio --</option>
                {% for navio in form.navio.field.queryset %}
                    {% if object and object.navio_id == navio.id %}
                        <option value="{{ navio.id }}" selected>{{ navio.nome }}</option>
                    {% else %}
                        <option value="{{ navio.id }}">{{ navio.nome }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>
        
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nº Programação</label>
                <input type="text" name="numero_viagem" value="{{ object.numero_viagem|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">PSP</label>
                <input type="text" name="psp" value="{{ object.psp|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Sentido</label>
                <select name="sentido" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
                    <option value="DESCARGA" {% if object.sentido == 'DESCARGA' or not object %}selected{% endif %}>↓ Descarga (Importação)</option>
                    <option value="CARGA" {% if object.sentido == 'CARGA' %}selected{% endif %}>↑ Carga (Exportação)</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">
                    Quantidade Prevista
                    <span class="text-xs text-gray-400 font-normal">(do BL)</span>
                </label>
                <input type="number" name="quantidade_prevista" min="0" value="{{ object.quantidade_prevista|default:0 }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Operador Portuário</label>
            <select name="operador_portuario" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
                <option value="">-- Selecione o Operador --</option>
                {% for operador in operadores %}
                    {% if object and object.operador_portuario_id == operador.id %}
                        <option value="{{ operador.id }}" selected>{{ operador.nome_empresa }}</option>
                    {% else %}
                        <option value="{{ operador.id }}">{{ operador.nome_empresa }}</option>
                    {% endif %}
                {% endfor %}
            </select>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Fundeio / ETA</label>
                <input type="date" name="data_prevista_chegada" value="{{ object.data_prevista_chegada|date:'Y-m-d'|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Atracação / ETB</label>
                <input type="date" name="data_chegada_real" value="{{ object.data_chegada_real|date:'Y-m-d'|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Desatracação / ETS</label>
                <input type="date" name="data_desatracacao" value="{{ object.data_desatracacao|date:'Y-m-d'|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Berço de Atracação</label>
            <input type="text" name="bercario_atracacao" value="{{ object.bercario_atracacao|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Agência (Texto Livre)</label>
            <input type="text" name="agencia" value="{{ object.agencia|default:'' }}" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
            <select name="status" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
                <option value="AGUARDANDO_CHEGADA" {% if object.status == 'AGUARDANDO_CHEGADA' %}selected{% endif %}>Esperado</option>
                <option value="FUNDEADO" {% if object.status == 'FUNDEADO' %}selected{% endif %}>Fundeado</option>
                <option value="ATRACADO" {% if object.status == 'ATRACADO' %}selected{% endif %}>Atracado / Operando</option>
                <option value="DESCARREGANDO" {% if object.status == 'DESCARREGANDO' %}selected{% endif %}>Descarregando</option>
                <option value="CARREGANDO" {% if object.status == 'CARREGANDO' %}selected{% endif %}>Carregando</option>
                <option value="FINALIZADO" {% if object.status == 'FINALIZADO' %}selected{% endif %}>Finalizado</option>
            </select>
        </div>

        <div class="flex gap-4 pt-4">
            <button type="submit" class="btn-Docksync px-6 py-3 rounded-lg font-bold shadow-md transition">Salvar Programação</button>
            <a href="{% url 'viagem_list' %}" class="px-6 py-3 rounded-lg font-bold text-gray-500 hover:bg-gray-100 transition">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}

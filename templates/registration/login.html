{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Docksync</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body {
            background: #0B1A2A;
        }

        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(rgba(5, 15, 30, 0.85), rgba(5, 15, 30, 0.85)), url('https://images.unsplash.com/photo-1578575437130-527eed3abbec?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(11, 26, 42, 0.95);
            border: 1px solid rgba(0, 174, 239, 0.2);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
            text-align: center;
        }

        .logo-img {
            max-width: 200px;
            height: auto;
            object-fit: contain;
            margin: 0 auto 25px;
            display: block;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.75rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .title {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            color: #94a3b8;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 14px 16px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .input-field:focus {
            border-color: #00AEEF;
            background: rgba(30, 41, 59, 0.9);
        }

        /* Correção para o fundo branco do autofill do navegador */
        .input-field:-webkit-autofill,
        .input-field:-webkit-autofill:hover,
        .input-field:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff;
            -webkit-box-shadow: 0 0 0px 1000px #1e293b inset;
            transition: background-color 5000s ease-in-out 0s;
        }

        .captcha-area {
            background: rgba(30, 41, 59, 0.8);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #334155;
        }

        .captcha-text {
            color: #cbd5e1;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 6px;
        }

        .btn-login {
            width: 100%;
            background: #00AEEF;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 25px;
        }

        .btn-login:hover {
            background: #0091cc;
        }

        .btn-azure {
            width: 100%;
            background: #ffffff;
            color: #0B1A2A;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-azure:hover {
            background: #f8fafc;
        }

        .forgot-links {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .forgot-links a {
            color: #00AEEF;
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-links a:hover {
            text-decoration: underline;
        }

        .error-msg {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid #f43f5e;
            color: #fda4af;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            
            <!-- Logo centralizado com tamanho correto -->
            <img src="{% static 'images/Docksync-logo.png' %}" alt="Docksync" class="logo-img">
            
            <p class="subtitle">Autoridade Portuária</p>
            <p class="title">Sistema de Gestão Portuária</p>

            {% if messages %}
                {% for message in messages %}
                <div class="error-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post">
                {% csrf_token %}
                
                <div class="input-group">
                    <label class="input-label">Usuário</label>
                    <input type="text" name="username" required class="input-field" placeholder="Digite seu usuário">
                </div>

                <div class="input-group">
                    <label class="input-label">Senha</label>
                    <input type="password" name="password" required class="input-field" placeholder="Digite sua senha">
                </div>

                <!-- Captcha matemático -->
                <div class="captcha-area">
                    <span class="captcha-text">{{ captcha_texto }}</span>
                </div>
                
                <div class="input-group">
                    <label class="input-label">Digite o resultado acima</label>
                    <input type="number" name="captcha_resposta" placeholder="Resposta" required class="input-field">
                    <input type="hidden" name="captcha_esperado" value="{{ captcha_esperado }}">
                </div>

                <button type="submit" class="btn-login">ENTRAR</button>
            </form>

            <button type="button" class="btn-azure">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="#0078D4">
                    <path d="M13.05 4.24L6.56 18.05h4.44l1.42-3.66h5.74l1.41 3.66h4.44L17.56 4.24h-4.51zm.81 5.26l2.03 5.23h-4.06l2.03-5.23zM2 20.35l6.29-2.51-4.34-9.2L2 20.35z"/>
                </svg>
                Azure AD
            </button>

            <div class="forgot-links">
                <a href="#">Esqueceu sua senha? Clique Aqui!</a>
                <a href="#">Deseja revalidar? Clique Aqui!</a>
            </div>

        </div>
    </div>
</body>
</html>

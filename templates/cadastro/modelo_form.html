{% extends 'base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold text-[#0B1A2A] mb-6">➕ Cadastrar Novo Modelo de Veículo</h2>
    
    <form method="post" class="space-y-4" id="modeloForm">
        {% csrf_token %}
        
        <div class="grid grid-cols-3 gap-4">
            <div class="col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Fabricante</label>
                <input type="text" name="fabricante" value="{{ object.fabricante|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
            <div class="col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Modelo</label>
                <input type="text" name="modelo" value="{{ object.modelo|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
            <div class="col-span-1">
                <label class="block text-sm font-medium text-gray-700 mb-1">Ano</label>
                <input type="number" name="ano" value="{{ object.ano|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">
                Nome Abreviado 
                <span class="text-xs text-gray-400 font-normal">(opcional — usado quando o nome no BL é diferente ou em código)</span>
            </label>
            <input type="text" name="abreviado" value="{{ object.abreviado|default:'' }}" maxlength="50" placeholder="Ex: HILUX, HAVAL H9, TUCSON" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Comprimento (m)</label>
                <input type="number" step="0.01" name="comprimento" id="comprimento" value="{{ object.comprimento|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Largura (m)</label>
                <input type="number" step="0.01" name="largura" id="largura" value="{{ object.largura|default:'' }}" required class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-[#00AEEF] outline-none">
            </div>
        </div>

        <div class="bg-[#0B1A2A] text-white p-4 rounded-lg flex justify-between items-center">
            <span class="text-sm font-medium">Área Calculada (m²)</span>
            <span id="resultadoArea" class="text-2xl font-bold text-[#00AEEF]">0.00 m²</span>
        </div>

        <div class="flex gap-4 pt-4">
            <button type="submit" class="btn-Docksync px-6 py-3 rounded-lg font-bold shadow-md transition">Salvar Modelo</button>
            <a href="{% url 'modelo_list' %}" class="px-6 py-3 rounded-lg font-bold text-gray-500 hover:bg-gray-100 transition">Cancelar</a>
        </div>
    </form>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const comprimentoInput = document.getElementById('comprimento');
        const larguraInput = document.getElementById('largura');
        const resultadoArea = document.getElementById('resultadoArea');

        function calcularArea() {
            const comp = parseFloat(comprimentoInput.value) || 0;
            const larg = parseFloat(larguraInput.value) || 0;
            const area = comp * larg;
            resultadoArea.textContent = area.toFixed(2) + ' m²';
        }

        comprimentoInput.addEventListener('input', calcularArea);
        larguraInput.addEventListener('input', calcularArea);
        calcularArea();
    });
</script>
{% endblock %}

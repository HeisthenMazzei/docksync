{% extends 'base.html' %}

{% block content %}
<div class="max-w-md mx-auto mt-20 bg-white p-8 rounded-xl shadow-md border border-red-100 text-center">
    <h2 class="text-2xl font-bold text-red-600 mb-4">Confirmar Exclusão</h2>
    <p class="text-gray-600 mb-6">Tem certeza que deseja excluir o usuário <strong>"{{ object.username }}"</strong>? Esta ação não poderá ser desfeita.</p>
    
    <form method="post" class="flex justify-center gap-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 transition">Sim, Excluir</button>
        <a href="{% url 'usuario_list' %}" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">Cancelar</a>
    </form>
</div>
{% endblock %}

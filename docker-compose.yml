version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: Docksync_db
      POSTGRES_USER: Docksync_user
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DJANGO_DEBUG=True
      - POSTGRES_DB=Docksync_db
      - POSTGRES_USER=Docksync_user
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_HOST=db

volumes:
  postgres_data: